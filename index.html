<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plant a tree</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1418);
    --card: var(--tg-theme-secondary-bg-color, #182027);
    --text: var(--tg-theme-text-color, #e8eef2);
    --hint: var(--tg-theme-hint-color, #8a99a5);
    --accent: var(--tg-theme-button-color, #2fb58a);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--hint) 28%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 14px 16px 96px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--hint);
    margin: 14px 4px 7px; }
  main > h2:first-child { margin-top: 4px; }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  #what { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
  label.opt { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 12px 10px 11px;
    background: var(--card); cursor: pointer; min-width: 0; }
  label.opt:has(input:checked) { background: color-mix(in srgb, var(--accent) 16%, var(--card)); }
  label.opt input { position: absolute; opacity: 0; pointer-events: none; }
  .dot { width: 20px; height: 20px; border-radius: 50%; flex: none; position: relative;
    box-shadow: inset 0 0 0 2px color-mix(in srgb, #000 18%, transparent); }
  .dot i { position: absolute; right: -2px; bottom: -2px; width: 8px; height: 8px; border-radius: 50%; }
  .name { min-width: 0; }
  .name b { font-weight: 600; display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name small { color: var(--hint); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tick { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--line); display: grid; place-items: center; }
  input:checked ~ .tick { border-color: var(--accent); background: var(--accent); }
  input:checked ~ .tick::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-text); }
  input:focus-visible ~ .tick { outline: 2px solid var(--accent); outline-offset: 2px; }
  .time { padding: 16px 16px 18px; }
  .readout { font-size: 34px; font-weight: 700; text-align: center; letter-spacing: -.01em; }
  .readout small { display: block; font-size: 13px; font-weight: 400; color: var(--hint); margin-top: 2px; }
  input[type=range] { width: 100%; margin: 16px 0 4px; accent-color: var(--accent); height: 28px; }
  .scale { display: flex; justify-content: space-between; color: var(--hint); font-size: 12px; padding: 0 2px; }
  .seg { display: flex; gap: 6px; padding: 10px; flex-wrap: wrap; }
  .seg label { flex: 1 1 0; min-width: 52px; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; text-align: center; padding: 9px 4px; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
  .seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { width: 100%; padding: 13px 14px; border: 0; background: transparent; color: var(--text); font: inherit; }
  .note::placeholder { color: var(--hint); }
  .ago { padding: 4px 16px 14px; }
  .ago[hidden] { display: none; }
  .ago .agoval { text-align: center; font-size: 20px; font-weight: 700; margin-top: 2px; }
  .ago .agoval small { display: block; font-size: 12px; font-weight: 400; color: var(--hint); }
  .ago input[type=range] { margin-top: 10px; }
  .bar { position: sticky; bottom: 0; padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent); margin-top: 8px; }
  #send { display: block; width: 100%; padding: 15px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--accent); color: var(--accent-text); font-family: inherit; font-size: 17px; font-weight: 600; }
  #send:disabled { opacity: .45; cursor: default; }
  #send:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .outside { color: var(--hint); font-size: 13px; text-align: center; margin: 8px 0 0; display: none; }
</style>
</head>
<body>
<main>
  <h2 id="whatLabel">What was it</h2>
  <div class="card" id="what" role="radiogroup" aria-labelledby="whatLabel"></div>

  <h2 id="lenLabel">How long</h2>
  <div class="card time">
    <div class="readout" id="readout" aria-live="polite">1 h<small>focused</small></div>
    <input type="range" id="len" min="0" step="1" aria-labelledby="lenLabel">
    <div class="scale"><span>5 min</span><span>2 h</span><span>10 h</span></div>
  </div>

  <h2 id="whenLabel">When</h2>
  <div class="card">
    <div class="seg" id="when" role="radiogroup" aria-labelledby="whenLabel">
      <label><input type="radio" name="when" value="today" checked><span>Today</span></label>
      <label><input type="radio" name="when" value="ago"><span>Hours ago</span></label>
    </div>
    <div class="ago" id="agoBox" hidden>
      <div class="agoval" id="agoVal" aria-live="polite">2 h ago<small>finished at 18:30</small></div>
      <input type="range" id="ago" min="1" max="48" step="1" value="4" aria-label="Finished how long ago">
      <div class="scale"><span>30 min</span><span>12 h</span><span>24 h</span></div>
    </div>
  </div>

  <h2 id="noteLabel">Note</h2>
  <div class="card"><input class="note" id="note" maxlength="140" placeholder="optional" aria-labelledby="noteLabel"></div>

  <div class="bar">
    <button id="send" type="button">Plant</button>
    <p class="outside" id="outside">Open this page from your Jarvis bot in Telegram to plant.</p>
  </div>
</main>
<script>
// The activities are his Forest-app tags; each grows the tree type he gave that tag on the phone.
const ACTIVITIES = [
  {tag: "Work", species: "maple", tree: "maple", leaf: "#F0703C"},
  {tag: "Gym", species: "golden_trumpet", tree: "golden trumpet", leaf: "#F7C531"},
  {tag: "Box", species: "golden_trumpet", tree: "golden trumpet", leaf: "#F7C531"},
  {tag: "Languages", species: "forest_spirit", tree: "forest spirit", leaf: "#6FF2C4", accent: "#F2FFF9"},
  {tag: "DevOps", species: "green_oak", tree: "green oak", leaf: "#4CC38A"},
  {tag: "Reading", species: "jacaranda", tree: "jacaranda", leaf: "#A98BFF"},
  {tag: "Python", species: "weeping_willow", tree: "weeping willow", leaf: "#9BE38C"},
  {tag: "Routine", species: "bush", tree: "bush", leaf: "#5FD068"},
  {tag: "", species: "tangerine", tree: "tangerine", leaf: "#43B66E", accent: "#FF9F1C", label: "No tag"},
];
// slider positions -> minutes: 5-minute steps up to 2 h, then 15-minute steps up to 10 h
const STEPS = [];
for (let m = 5; m <= 120; m += 5) STEPS.push(m);
for (let m = 135; m <= 600; m += 15) STEPS.push(m);

const tg = window.Telegram && window.Telegram.WebApp;
// Opened from the bot's keyboard button, Telegram leaves initData empty, so look at the platform instead
// (it is "unknown" in a plain browser). sendData only works inside Telegram.
const inTelegram = !!(tg && typeof tg.sendData === "function" && tg.platform && tg.platform !== "unknown");
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("plant." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("plant." + k, JSON.stringify(v)); } catch (e) { /* private mode */ } },
};
const fmt = (m) => (m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ""}`);
const hhmm = (d) => `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;

$("what").innerHTML = ACTIVITIES.map((a, i) => `
  <label class="opt"><input type="radio" name="what" value="${i}">
    <span class="dot" style="background:${a.leaf}">${a.accent ? `<i style="background:${a.accent}"></i>` : ""}</span>
    <span class="name"><b>${a.label || a.tag}</b><small>${a.tree}</small></span><span class="tick"></span></label>`).join("");

const len = $("len"), agoIn = $("ago");
len.max = String(STEPS.length - 1);
agoIn.value = String(store.get("ago", 4));  // half-hours: 1 = 30 min .. 48 = 24 h
const lastTag = store.get("tag", "Work");
const pick = Math.max(0, ACTIVITIES.findIndex((a) => a.tag === lastTag));
document.querySelector(`input[name=what][value="${pick}"]`).checked = true;

function minutesFor(i) { return store.get("min." + ACTIVITIES[i].tag, ACTIVITIES[i].tag === "Work" ? 180 : 60); }
function setMinutes(m) {
  let best = 0;
  STEPS.forEach((s, i) => { if (Math.abs(s - m) < Math.abs(STEPS[best] - m)) best = i; });
  len.value = String(best);
  render();
}
const mode = () => document.querySelector("input[name=when]:checked").value;
const current = () => ({
  a: ACTIVITIES[Number(document.querySelector("input[name=what]:checked").value)],
  minutes: STEPS[Number(len.value)],
  ago: mode() === "ago" ? Number(agoIn.value) * 30 : 0,  // "Today": it ends when it is sent
});
function render() {
  const c = current();
  $("readout").innerHTML = `${fmt(c.minutes)}<small>${c.a.label || c.a.tag} · ${c.a.tree}</small>`;
  $("agoBox").hidden = mode() !== "ago";
  if (mode() === "ago") {
    const end = new Date(Date.now() - c.ago * 60000), today = new Date().toDateString() === end.toDateString();
    $("agoVal").innerHTML = `${fmt(c.ago)} ago<small>finished ${today ? "today" : "yesterday"} at ${hhmm(end)}</small>`;
  }
  $("send").textContent = `Plant ${c.a.tree} · ${fmt(c.minutes)}`;
}
setMinutes(minutesFor(pick));

const haptic = () => { if (inTelegram && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); };
$("what").addEventListener("change", (e) => { haptic(); setMinutes(minutesFor(Number(e.target.value))); });
$("when").addEventListener("change", () => { haptic(); render(); });
len.addEventListener("input", () => { haptic(); render(); });
agoIn.addEventListener("input", () => { haptic(); render(); });

function send() {
  if (!inTelegram) return;
  const c = current();
  const note = $("note").value.replace(/\s+/g, " ").trim().slice(0, 140);
  store.set("tag", c.a.tag);
  store.set("min." + c.a.tag, c.minutes);
  store.set("ago", Number(agoIn.value));
  $("send").disabled = true;
  // Telegram hands this to the bot as message.web_app_data (and closes the page); Jarvis checks every field again
  tg.sendData(JSON.stringify({v: 1, tag: c.a.tag, species: c.a.species, minutes: c.minutes, ago: c.ago, note}));
}
$("send").addEventListener("click", send);

if (inTelegram) {
  tg.ready();
  tg.expand();
} else {
  $("send").disabled = true;
  $("outside").style.display = "block";
}
</script>
</body>
</html>
